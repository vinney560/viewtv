<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #111b21;
            --secondary-bg: #202c33;
            --message-bg: rgba(255, 255, 255, 0.05);
            --hover-bg: rgba(255, 255, 255, 0.08);
            --active-bg: rgba(255, 255, 255, 0.12);
            --accent-color: #3a70d5;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --text-muted: #667781;
            --online-status: #3fb950;
            --unread-badge: #f85149;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--primary-bg);
            font-family: 'Roboto', sans-serif;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 18px;
            padding: 0;
            margin: 0;
        }
        
        .header {
            background: var(--secondary-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .search-container {
            display: flex;
            align-items: center;
            background: var(--message-bg);
            border-radius: 20px;
            padding: 12px 18px;
            margin: 15px 20px;
        }
        
        .search-container i {
            color: var(--text-muted);
            margin-right: 12px;
            font-size: 20px;
        }
        
        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 100%;
            font-size: 18px;
            font-family: 'Roboto', sans-serif;
        }
        
        .search-container input:focus {
            outline: none;
        }
        
        .search-container input::placeholder {
            color: var(--text-muted);
        }
        
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 15px 15px;
        }
        
        .user-item {
            background: var(--message-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .user-item:hover {
            background: var(--hover-bg);
        }
        
        .user-item.active {
            background: var(--active-bg);
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4a5568, #718096);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            margin-right: 18px;
            flex-shrink: 0;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        .status-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--online-status);
            position: absolute;
            bottom: 5px;
            right: 5px;
            border: 2px solid var(--secondary-bg);
        }
        
        .user-details {
            flex: 1;
            min-width: 0;
        }
        
        .user-name-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .user-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .message-time {
            font-size: 16px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 10px;
        }
        
        .user-message {
            font-size: 18px;
            color: var(--text-secondary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .message-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .notification-badge {
            background: var(--unread-badge);
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            margin-left: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 60px 40px;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .empty-state p {
            font-size: 18px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            body {
                font-size: 16px;
            }
            
            .header {
                padding: 12px 15px;
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .search-container {
                margin: 10px 15px;
                padding: 10px 15px;
            }
            
            .user-item {
                padding: 15px;
            }
            
            .user-avatar {
                width: 55px;
                height: 55px;
                font-size: 22px;
                margin-right: 15px;
            }
            
            .user-name {
                font-size: 18px;
            }
            
            .user-message {
                font-size: 16px;
            }
        }
        
        /* Particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="header">
        <h1 class="header-title"><i class="fas fa-comments"></i> User Messages</h1>
    </div>
    
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search messages...">
    </div>
    
    <div class="user-list" id="userList">
        {% if users %}
            {% for user in users %}
            <div class="user-item" data-userid="{{ user.id }}">
                <div class="user-avatar">{{ user.name[0] }}
                    <div class="status-indicator"></div>
                </div>
                <div class="user-details">
                    <div class="user-name-time">
                        <div class="user-name">{{ user.name }}</div>
                        <div class="message-time">2:45 PM</div>
                    </div>
                    <div class="message-preview">
                        <div class="user-message">...Support is here</div>
                        {% if user.unread_count > 0 %}
                        <div class="notification-badge">{{ user.unread_count }}</div>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <i class="fas fa-comment-slash"></i>
                <h3>No messages yet</h3>
                <p>Users will appear here when they message you</p>
            </div>
        {% endif %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create background particles
            createParticles();
            
            // Add click effect to user items
            initUserItems();
            
            // Add search functionality
            initSearch();
        });
        
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 50-200px
                const size = Math.random() * 150 + 50;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random opacity
                particle.style.opacity = Math.random() * 0.1;
                
                container.appendChild(particle);
            }
        }
        
        function initUserItems() {
            const userItems = document.querySelectorAll('.user-item');
            
            userItems.forEach(item => {
                item.addEventListener('click', function() {
                    // Remove active class from all items
                    userItems.forEach(i => i.classList.remove('active'));
                    
                    // Add active class to clicked item
                    this.classList.add('active');
                    
                    // Get the user ID safely
                    const userId = this.dataset.userid;
                    if (userId && userId !== '') {
                        // Navigate to chat after a slight delay for visual feedback
                        setTimeout(() => {
                            window.location.href = `/chat/${userId}`;
                        }, 200);
                    } else {
                        console.error('Invalid user ID');
                    }
                });
            });
        }
        
        function initSearch() {
            const searchInput = document.querySelector('.search-container input');
            const userItems = document.querySelectorAll('.user-item');
            
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                userItems.forEach(item => {
                    const userName = item.querySelector('.user-name').textContent.toLowerCase();
                    const userMessage = item.querySelector('.user-message').textContent.toLowerCase();
                    
                    if (userName.includes(searchTerm) || userMessage.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
    </script>
</body>
</html>
