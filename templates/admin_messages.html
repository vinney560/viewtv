<!DOCTYPE html>
<html>
<head>
    <title>Admin Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a5568;
            --secondary: #2d3748;
            --accent: #718096;
            --light: #e2e8f0;
            --dark: #1a202c;
            --card-bg: rgba(255, 255, 255, 0.12);
            --message-bg: rgba(255, 255, 255, 0.08);
            --hover-bg: rgba(255, 255, 255, 0.15);
            --active-bg: rgba(255, 255, 255, 0.2);
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%234a5568" width="100" height="100"/><path fill="%232d3748" d="M0 0L100 100" stroke-width="0"/><path fill="%23374151" d="M100 0L0 100" stroke-width="0"/></svg>');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.9rem;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 98%;
            max-width: 1000px;
            height: 85vh;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h2 {
            margin: 0;
            color: white;
            font-weight: 600;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 15px;
            width: 30%;
        }
        
        .search-container i {
            color: rgba(255, 255, 255, 0.7);
            margin-right: 10px;
        }
        
        .search-container input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.9rem;
        }
        
        .search-container input:focus {
            outline: none;
        }
        
        .search-container input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .user-list {
            height: 100%;
            overflow-y: auto;
            padding: 0;
            position: relative;
            z-index: 2;
        }
        
        .user-item {
            background: var(--message-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .user-item:hover {
            background: var(--hover-bg);
        }
        
        .user-item.active {
            background: var(--active-bg);
        }
        
        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4a5568, #718096);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            margin-right: 15px;
            flex-shrink: 0;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .user-details {
            flex: 1;
            min-width: 0;
        }
        
        .user-name-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .message-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-shrink: 0;
            margin-left: 10px;
        }
        
        .user-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .message-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .notification-badge {
            background: #e53e3e;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            margin-left: 10px;
            box-shadow: 0 0 10px rgba(229, 62, 62, 0.7);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        /* Scrollbar styling */
        .user-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .user-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        .user-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #48bb78;
            position: absolute;
            bottom: 5px;
            right: 5px;
            border: 2px solid var(--secondary);
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
        }
        
        @media (max-width: 768px) {
            .glass-container {
                height: 95vh;
                width: 100%;
                border-radius: 0;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .search-container {
                width: 100%;
            }
            
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="glass-container">
        <div class="header">
            <h2><i class="fas fa-comments"></i> User Messages</h2>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search messages...">
            </div>
        </div>
        
        <div class="user-list" id="userList">
            {% if users %}
                {% for user in users %}
                <div class="user-item" data-userid="{{ user.id }}" onclick="location.href='{{ url_for('chat', user_id=user.id) }}'">
                    <div class="avatar-container">
                        <div class="user-avatar">{{ user.name[0] }}</div>
                        <div class="status-indicator"></div>
                    </div>
                    <div class="user-details">
                        <div class="user-name-time">
                            <div class="user-name">{{ user.name }}</div>
                            <div class="message-time">2:45 PM</div>
                        </div>
                        <div class="message-preview">
                            <div class="user-message">Last message preview goes here...</div>
                            {% if user.unread_count > 0 %}
                            <div class="notification-badge">{{ user.unread_count }}</div>
                            {% endif %}
                        </div>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    <h3>No messages yet</h3>
                    <p>Users will appear here when they message you</p>
                </div>
            {% endif %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create background particles
            createParticles();
            
            // Initialize mouse move effect
            initMouseMoveEffect();
            
            // Add click effect to user items
            initUserItems();
            
            // Add search functionality
            initSearch();
        });
        
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 50-200px
                const size = Math.random() * 150 + 50;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                container.appendChild(particle);
            }
        }
        
        function initMouseMoveEffect() {
            const container = document.querySelector('.glass-container');
            
            container.addEventListener('mousemove', function(e) {
                const { left, top, width, height } = container.getBoundingClientRect();
                const x = (e.clientX - left) / width - 0.5;
                const y = (e.clientY - top) / height - 0.5;
                
                // Move particles in opposite direction for depth effect
                const particles = document.querySelectorAll('.particle');
                particles.forEach(particle => {
                    const speed = parseInt(particle.style.width) / 30;
                    particle.style.transform = `translateX(${-x * speed}px) translateY(${-y * speed}px)`;
                });
            });
            
            // Reset transformations when mouse leaves
            container.addEventListener('mouseleave', function() {
                const particles = document.querySelectorAll('.particle');
                particles.forEach(particle => {
                    particle.style.transform = 'translate(0, 0)';
                });
            });
        }
        
        function initUserItems() {
            const userItems = document.querySelectorAll('.user-item');
            
            userItems.forEach(item => {
                item.addEventListener('click', function() {
                    // Remove active class from all items
                    userItems.forEach(i => i.classList.remove('active'));
                    
                    // Add active class to clicked item
                    this.classList.add('active');
                    
                    // Navigate to chat after a slight delay for visual feedback
                    setTimeout(() => {
                        window.location.href = this.dataset.userid ? 
                            `{{ url_for('chat', user_id='') }}${this.dataset.userid}` : 
                            '#';
                    }, 200);
                });
            });
        }
        
        function initSearch() {
            const searchInput = document.querySelector('.search-container input');
            const userItems = document.querySelectorAll('.user-item');
            
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                userItems.forEach(item => {
                    const userName = item.querySelector('.user-name').textContent.toLowerCase();
                    const userMessage = item.querySelector('.user-message').textContent.toLowerCase();
                    
                    if (userName.includes(searchTerm) || userMessage.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
    </script>
</body>
</html>
