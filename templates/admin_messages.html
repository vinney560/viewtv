<!DOCTYPE html>
<html>
<head>
    <title>Admin Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a5568;
            --secondary: #2d3748;
            --accent: #718096;
            --light: #e2e8f0;
            --dark: #1a202c;
            --card-bg: rgba(255, 255, 255, 0.12);
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%234a5568" width="100" height="100"/><path fill="%232d3748" d="M0 0L100 100" stroke-width="0"/><path fill="%23374151" d="M100 0L0 100" stroke-width="0"/></svg>');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.7rem;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 98%;
            max-width: 1000px;
            height: 40vh;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h2 {
            margin: 0;
            color: white;
            font-weight: 600;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .user-list {
            height: calc(100% - 80px);
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px;
            display: flex;
            flex-direction: row;
            gap: 20px;
            position: relative;
            z-index: 2;
        }
        
        .user-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-width: 250px;
            height: 380px;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .user-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25), 0 0 20px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .user-card:hover::before {
            opacity: 1;
        }
        
        .user-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4a5568, #718096);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 36px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .user-card:hover .user-avatar {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin: 10px 0 5px 0;
            position: relative;
            z-index: 2;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        
        .user-email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .notification-badge {
            background: #e53e3e;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            margin-top: 10px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 15px rgba(229, 62, 62, 0.7);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        /* Scrollbar styling for horizontal layout */
        .user-list::-webkit-scrollbar {
            height: 8px;
        }
        
        .user-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        .user-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="glass-container">
        <div class="header">
            <h2>User Messages</h2>
        </div>
        
        <div class="user-list" id="userList">
            {% if users %}
                {% for user in users %}
                <div class="user-card" data-userid="{{ user.id }}" onclick="location.href='{{ url_for('chat', user_id=user.id) }}'">
                    <div class="user-avatar">{{ user.name[0] }}</div>
                    <div class="user-name">{{ user.name }}</div>
                    <div class="user-email">{{ user.email }}</div>
                    {% if user.unread_count > 0 %}
                    <div class="notification-badge">{{ user.unread_count }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    <h3>No messages yet</h3>
                    <p>Users will appear here when they message you</p>
                </div>
            {% endif %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create background particles
            createParticles();
            
            // Initialize mouse move effect
            initMouseMoveEffect();
            
            // Add subtle shuffle animation to user cards
            shuffleUserCards();
        });
        
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 50-200px
                const size = Math.random() * 150 + 50;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                container.appendChild(particle);
            }
        }
        
        function initMouseMoveEffect() {
            const userCards = document.querySelectorAll('.user-card');
            const container = document.querySelector('.glass-container');
            
            container.addEventListener('mousemove', function(e) {
                const { left, top, width, height } = container.getBoundingClientRect();
                const x = (e.clientX - left) / width - 0.5;
                const y = (e.clientY - top) / height - 0.5;
                
                // Apply subtle parallax effect to user cards
                userCards.forEach(card => {
                    const speed = 5;
                    card.style.transform = `translateY(-8px) scale(1.03) translateX(${x * speed}px) translateY(${y * speed}px)`;
                });
                
                // Move particles in opposite direction for depth effect
                const particles = document.querySelectorAll('.particle');
                particles.forEach(particle => {
                    const speed = parseInt(particle.style.width) / 30;
                    particle.style.transform = `translateX(${-x * speed}px) translateY(${-y * speed}px)`;
                });
            });
            
            // Reset transformations when mouse leaves
            container.addEventListener('mouseleave', function() {
                userCards.forEach(card => {
                    card.style.transform = 'translateY(-8px) scale(1.03)';
                });
                
                const particles = document.querySelectorAll('.particle');
                particles.forEach(particle => {
                    particle.style.transform = 'translate(0, 0)';
                });
            });
        }
        
        function shuffleUserCards() {
            const userList = document.getElementById('userList');
            if (!userList) return;
            
            const userCards = Array.from(document.querySelectorAll('.user-card'));
            if (userCards.length === 0) return;
            
            // Clear the container
            userList.innerHTML = '';
            
            // Fisher-Yates shuffle algorithm
            for (let i = userCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [userCards[i], userCards[j]] = [userCards[j], userCards[i]];
            }
            
            // Add shuffled cards back to container
            userCards.forEach(card => {
                userList.appendChild(card);
            });
            
            // Add subtle staggered appearance animation
            userCards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }
    </script>
</body>
</html>
