<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Channels | ViewTV</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#06b6d4',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                        dark: '#0f172a',
                    },
                    animation: {
                        'slide-in': 'slideIn 0.3s ease-out',
                        'fade-in': 'fadeIn 0.4s ease-out',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #10b981;
            --accent: #8b5cf6;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }
        
        /* Card hover effects */
        .channel-card {
            transition: all 0.2s ease;
            transform-origin: center;
        }
        
        .channel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(6, 182, 212, 0.3);
        }
        
        /* Glass effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
        }
        
        /* Status badges */
        .status-live {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .status-offline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .status-checking {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        
        /* Smooth animations */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* Search highlight */
        .search-highlight {
            background-color: rgba(6, 182, 212, 0.2);
            transition: background-color 1s ease-out;
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-b border-slate-700/30">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                        <i class="fas fa-tv text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold gradient-text">ViewTV Channels</h1>
                        <p class="text-xs text-slate-400">Stream live TV worldwide</p>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="relative w-full md:w-96">
                    <div class="relative">
                        <input type="text" 
                               id="searchInput" 
                               placeholder="Search channels..." 
                               class="w-full bg-slate-800/70 border border-slate-700/50 rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                               autocomplete="off">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <button id="clearSearch" class="absolute right-3 top-3.5 text-slate-400 hover:text-white hidden">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <!-- Search Suggestions -->
                    <div id="searchSuggestions" class="absolute top-full left-0 right-0 mt-1 glass-panel rounded-xl shadow-xl hidden z-50 max-h-64 overflow-y-auto">
                        <!-- Suggestions will be injected here -->
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="flex items-center space-x-3">
                    <button id="filterToggle" class="px-4 py-2 bg-slate-800/70 hover:bg-primary/20 rounded-xl transition border border-slate-700/50 flex items-center space-x-2">
                        <i class="fas fa-filter text-primary"></i>
                        <span class="text-sm">Filters</span>
                    </button>
                    <a href="{{ url_for('dashboard') }}" class="p-2 hover:bg-slate-800/50 rounded-xl transition" title="Dashboard">
                        <i class="fas fa-home text-xl text-slate-300"></i>
                    </a>
                </div>
            </div>

            <!-- Filter Panel -->
            <div id="filterPanel" class="mt-4 hidden animate-slide-in">
                <div class="flex flex-wrap items-center gap-4 p-4 bg-slate-800/50 rounded-xl">
                    <div class="flex items-center space-x-3">
                        <span class="text-sm text-slate-300">Access:</span>
                        <div class="flex space-x-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="filter-checkbox" data-filter="access" value="free" checked>
                                <span class="text-sm text-slate-300">Free</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="filter-checkbox" data-filter="access" value="paid" checked>
                                <span class="text-sm text-slate-300">Paid</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <span class="text-sm text-slate-300">Status:</span>
                        <div class="flex space-x-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="filter-checkbox" data-filter="status" value="live">
                                <span class="text-sm text-slate-300">Live</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="filter-checkbox" data-filter="status" value="offline">
                                <span class="text-sm text-slate-300">Offline</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3 ml-auto">
                        <button id="clearFilters" class="text-sm text-primary hover:text-primary/80 transition">
                            Clear Filters
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Stats Bar -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-6">
                <div class="text-center">
                    <div class="text-2xl font-bold gradient-text" id="totalChannels">0</div>
                    <div class="text-sm text-slate-400">Total Channels</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-emerald-400" id="liveChannels">0</div>
                    <div class="text-sm text-slate-400">Live Now</div>
                </div>
            </div>
            <button id="refreshStatus" class="px-4 py-2 bg-slate-800/70 hover:bg-primary/20 rounded-xl transition border border-slate-700/50 flex items-center space-x-2">
                <i class="fas fa-sync-alt"></i>
                <span>Refresh Status</span>
            </button>
        </div>

        <!-- Categories Navigation -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Categories</h2>
                <button id="collapseAll" class="text-sm text-primary hover:text-primary/80">
                    Collapse All
                </button>
            </div>
            <div class="flex flex-wrap gap-2" id="categoryNav">
                <!-- Categories will be injected here -->
            </div>
        </div>

        <!-- Channels Grid -->
        <div id="channelsContainer" class="hidden">
            <!-- Channels will be dynamically loaded here -->
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center py-12">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400">Loading channels...</p>
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-12">
            <i class="fas fa-search text-4xl text-slate-400 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">No channels found</h3>
            <p class="text-slate-400">Try adjusting your search or filters</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-slate-700/30 py-6 mt-12">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-slate-400 hover:text-white transition">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="https://m.facebook.com/groups/1133498725276750/" class="text-slate-400 hover:text-blue-400 transition">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="#" class="text-slate-400 hover:text-red-400 transition">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>
                <p class="text-sm text-slate-400 text-center">
                    © 2025 ViewTV • Stream live TV channels worldwide
                </p>
            </div>
        </div>
    </footer>

    <!-- Quick Scroll Button -->
    <button id="scrollToTop" class="fixed bottom-6 right-6 w-12 h-12 bg-primary hover:bg-primary-dark rounded-full shadow-lg flex items-center justify-center transition-all duration-300 opacity-0 translate-y-10">
        <i class="fas fa-arrow-up text-white"></i>
    </button>

    <!-- JavaScript -->
    <script>
        // ================== STATE MANAGEMENT ==================
        const state = {
            channels: [],           // All channels data
            filteredChannels: [],   // Currently filtered channels
            categories: new Set(),  // Unique categories
            filters: {
                access: ['free', 'paid'],  // Show both by default
                status: [],                 // NO STATUS FILTER ON INITIAL LOAD
                search: ''
            },
            favorites: JSON.parse(localStorage.getItem('channelFavorites') || '[]'),
            searchDebounceTimer: null,
            statusCheckQueue: [],    // Queue for checking channel status
            statusCheckRunning: false
        };

        // ================== DOM ELEMENTS ==================
        const elements = {
            searchInput: document.getElementById('searchInput'),
            searchSuggestions: document.getElementById('searchSuggestions'),
            clearSearch: document.getElementById('clearSearch'),
            filterToggle: document.getElementById('filterToggle'),
            filterPanel: document.getElementById('filterPanel'),
            clearFilters: document.getElementById('clearFilters'),
            channelsContainer: document.getElementById('channelsContainer'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            noResults: document.getElementById('noResults'),
            categoryNav: document.getElementById('categoryNav'),
            totalChannels: document.getElementById('totalChannels'),
            liveChannels: document.getElementById('liveChannels'),
            scrollToTop: document.getElementById('scrollToTop'),
            refreshStatus: document.getElementById('refreshStatus'),
            collapseAll: document.getElementById('collapseAll')
        };

        // ================== INITIALIZATION ==================
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });

        async function init() {
            // 1. Load channels from template (SYNC - immediate)
            loadChannelsFromTemplate();
            
            // 2. Update stats immediately
            updateStats();
            
            // 3. Render ALL channels immediately (NO FILTERING)
            renderAllChannels();
            
            // 4. Hide loading, show channels
            elements.loadingIndicator.classList.add('hidden');
            elements.channelsContainer.classList.remove('hidden');
            
            // 5. Start background status checking
            setTimeout(startStatusChecking, 500);
            
            // 6. Setup event listeners
            setupEventListeners();
        }

        // ================== CORE FUNCTIONS ==================

        function loadChannelsFromTemplate() {
            const channelGroups = {{ categorized_channels | tojson | safe }};
            state.channels = [];
            state.categories.clear();

            for (const [category, channels] of Object.entries(channelGroups)) {
                state.categories.add(category || 'Uncategorized');
                
                channels.forEach(channel => {
                    state.channels.push({
                        id: channel.key,
                        name: channel.name,
                        displayName: channel.name,
                        category: category || 'Uncategorized',
                        country: channel.country || '',
                        access: (channel.access || 'free').toLowerCase(),
                        url: channel.url || '',
                        logo: channel.logo || '',
                        quality: channel.quality || 'HD',
                        status: 'checking',  // Default status
                        isFavorite: state.favorites.includes(channel.key),
                        description: channel.description || ''
                    });
                });
            }
        }

        function updateStats() {
            elements.totalChannels.textContent = state.channels.length;
            
            const liveCount = state.channels.filter(c => c.status === 'live').length;
            elements.liveChannels.textContent = liveCount;
        }

        // ================== RENDER FUNCTIONS ==================

        function renderAllChannels() {
            // Group by category
            const grouped = groupByCategory(state.channels);
            
            // Update category navigation
            updateCategoryNav(Object.keys(grouped));
            
            // Render channel groups
            renderChannelGroups(grouped);
        }

        function renderFilteredChannels() {
            // Apply filters
            state.filteredChannels = state.channels.filter(channel => {
                // Search filter
                if (state.filters.search && !channelMatchesSearch(channel, state.filters.search)) {
                    return false;
                }
                
                // Access filter
                if (!state.filters.access.includes(channel.access)) {
                    return false;
                }
                
                // Status filter - only apply if user has selected status filters
                if (state.filters.status.length > 0) {
                    if (!state.filters.status.includes(channel.status)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            // Group by category
            const grouped = groupByCategory(state.filteredChannels);
            
            // Update category navigation
            updateCategoryNav(Object.keys(grouped));
            
            // Show/hide no results message
            if (state.filteredChannels.length === 0) {
                elements.noResults.classList.remove('hidden');
                elements.channelsContainer.innerHTML = '';
            } else {
                elements.noResults.classList.add('hidden');
                renderChannelGroups(grouped);
            }
        }

        function groupByCategory(channels) {
            return channels.reduce((groups, channel) => {
                if (!groups[channel.category]) {
                    groups[channel.category] = [];
                }
                groups[channel.category].push(channel);
                return groups;
            }, {});
        }

        function updateCategoryNav(categories) {
            elements.categoryNav.innerHTML = categories.map(category => `
                <button class="category-nav-btn px-4 py-2 bg-slate-800/50 hover:bg-primary/20 rounded-xl transition border border-slate-700/50 text-sm"
                        data-category="${category}">
                    ${category}
                </button>
            `).join('');
            
            // Add click handlers
            document.querySelectorAll('.category-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    const section = document.getElementById(`category-${category.replace(/\s+/g, '-').toLowerCase()}`);
                    if (section) {
                        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        }

        function renderChannelGroups(groups) {
            elements.channelsContainer.innerHTML = Object.entries(groups).map(([category, channels]) => `
                <section class="category-section mb-10 fade-in" id="category-${category.replace(/\s+/g, '-').toLowerCase()}">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold flex items-center">
                            <i class="fas fa-tag mr-3 text-primary"></i>
                            ${category}
                        </h2>
                        <span class="text-sm text-slate-400 bg-slate-800/50 px-3 py-1 rounded-full">
                            ${channels.length} channels
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                        ${channels.map(channel => renderChannelCard(channel)).join('')}
                    </div>
                </section>
            `).join('');
            
            // Re-attach event listeners to new elements
            attachChannelCardListeners();
        }

        function renderChannelCard(channel) {
            const hasUrl = channel.url && channel.url.trim().length > 0;
            const isIpUrl = hasUrl && /^\d+\.\d+\.\d+\.\d+/.test(channel.url.replace(/https?:\/\//, '').split('/')[0]);
            
            return `
                <div class="channel-card glass-panel rounded-xl overflow-hidden border border-slate-700/50"
                     id="channel-${channel.id}"
                     data-id="${channel.id}"
                     data-name="${channel.displayName.toLowerCase()}"
                     data-category="${channel.category.toLowerCase()}"
                     data-country="${channel.country.toLowerCase()}"
                     data-access="${channel.access}"
                     data-status="${channel.status}">
                    
                    ${hasUrl ? `
                        <a href="${isIpUrl ? channel.url : `/plus-channel/${channel.id}`}" 
                           class="block h-full channel-link"
                           ${isIpUrl ? 'target="_blank"' : ''}
                           data-id="${channel.id}">
                    ` : '<div class="block h-full bg-slate-800/50">'}
                    
                        <!-- Channel Image -->
                        <div class="relative pt-[56.25%] bg-slate-800">
                            ${channel.logo ? `
                                <img src="${channel.logo}" 
                                     alt="${channel.displayName}"
                                     class="absolute inset-0 w-full h-full object-contain p-4"
                                     loading="lazy"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                            ` : ''}
                            <div class="absolute inset-0 flex items-center justify-center ${channel.logo ? 'hidden' : ''}">
                                <i class="fas fa-tv text-4xl text-slate-600"></i>
                            </div>
                            
                            <!-- Status Badge -->
                            <div class="absolute top-2 left-2">
                                <span class="status-${channel.status} px-2 py-1 rounded-full text-xs font-medium">
                                    ${channel.status === 'live' ? 'LIVE' : 
                                      channel.status === 'offline' ? 'OFFLINE' : 'CHECKING'}
                                </span>
                            </div>
                            
                            <!-- Favorite Button -->
                            <button class="favorite-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 flex items-center justify-center hover:bg-red-500 transition ${channel.isFavorite ? 'text-red-400' : 'text-white'}"
                                    data-id="${channel.id}">
                                <i class="${channel.isFavorite ? 'fas' : 'far'} fa-heart"></i>
                            </button>
                        </div>
                        
                        <!-- Channel Info -->
                        <div class="p-4">
                            <h3 class="font-bold truncate mb-1" title="${channel.displayName}">
                                ${channel.displayName}
                            </h3>
                            <div class="flex items-center justify-between text-sm text-slate-400">
                                <span>${channel.country || 'N/A'}</span>
                                <span class="text-primary">${channel.quality}</span>
                            </div>
                            <div class="mt-2 text-xs text-slate-500">
                                ${channel.access === 'paid' ? 'Premium' : 'Free'}
                            </div>
                        </div>
                    
                    ${hasUrl ? '</a>' : '</div>'}
                </div>
            `;
        }

        function attachChannelCardListeners() {
            // Favorite buttons
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const channelId = btn.dataset.id;
                    toggleFavorite(channelId, btn);
                });
            });
            
            // Non-IP links (prevent default for client-side handling)
            document.querySelectorAll('.channel-link:not([target="_blank"])').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const channelId = link.dataset.id;
                    playChannel(channelId);
                });
            });
        }

        // ================== EVENT HANDLERS ==================

        function setupEventListeners() {
            // Search
            elements.searchInput.addEventListener('input', handleSearchInput);
            elements.clearSearch.addEventListener('click', clearSearch);
            
            // Filters
            elements.filterToggle.addEventListener('click', toggleFilterPanel);
            document.querySelectorAll('.filter-checkbox').forEach(cb => {
                cb.addEventListener('change', handleFilterChange);
            });
            elements.clearFilters.addEventListener('click', clearAllFilters);
            
            // Other buttons
            elements.refreshStatus.addEventListener('click', startStatusChecking);
            elements.collapseAll.addEventListener('click', collapseAllCategories);
            elements.scrollToTop.addEventListener('click', scrollToTop);
            
            // Window events
            window.addEventListener('scroll', handleScroll);
            document.addEventListener('click', handleOutsideClick);
            document.addEventListener('keydown', handleKeyboardShortcuts);
        }

        function handleSearchInput(e) {
            clearTimeout(state.searchDebounceTimer);
            state.searchDebounceTimer = setTimeout(() => {
                const term = e.target.value.toLowerCase();
                state.filters.search = term;
                renderFilteredChannels();
                
                // Show/hide clear button
                elements.clearSearch.classList.toggle('hidden', !term);
                
                // Show suggestions
                if (term.length >= 2) {
                    showSearchSuggestions(term);
                } else {
                    elements.searchSuggestions.classList.add('hidden');
                }
            }, 300);
        }

        function clearSearch() {
            elements.searchInput.value = '';
            state.filters.search = '';
            elements.clearSearch.classList.add('hidden');
            elements.searchSuggestions.classList.add('hidden');
            renderFilteredChannels();
            elements.searchInput.focus();
        }

        function toggleFilterPanel() {
            elements.filterPanel.classList.toggle('hidden');
        }

        function handleFilterChange() {
            state.filters.access = Array.from(
                document.querySelectorAll('.filter-checkbox[data-filter="access"]:checked')
            ).map(cb => cb.value);
            
            state.filters.status = Array.from(
                document.querySelectorAll('.filter-checkbox[data-filter="status"]:checked')
            ).map(cb => cb.value);
            
            renderFilteredChannels();
        }

        function clearAllFilters() {
            // Reset checkboxes
            document.querySelectorAll('.filter-checkbox').forEach(cb => {
                if (cb.dataset.filter === 'access') {
                    cb.checked = true;
                } else if (cb.dataset.filter === 'status') {
                    cb.checked = false;
                }
            });
            
            // Reset state
            state.filters.access = ['free', 'paid'];
            state.filters.status = [];
            state.filters.search = '';
            
            // Clear UI
            elements.searchInput.value = '';
            elements.clearSearch.classList.add('hidden');
            elements.searchSuggestions.classList.add('hidden');
            
            // Re-render
            renderFilteredChannels();
            elements.filterPanel.classList.add('hidden');
        }

        function showSearchSuggestions(term) {
            const suggestions = state.channels
                .filter(channel => 
                    channel.displayName.toLowerCase().includes(term) ||
                    channel.category.toLowerCase().includes(term) ||
                    channel.country.toLowerCase().includes(term)
                )
                .slice(0, 8);
            
            if (suggestions.length > 0) {
                elements.searchSuggestions.innerHTML = suggestions.map(channel => `
                    <div class="p-3 hover:bg-slate-700/50 cursor-pointer border-b border-slate-700/30 last:border-0 search-suggestion"
                         data-id="${channel.id}">
                        <div class="flex items-center space-x-3">
                            ${channel.logo ? `
                                <img src="${channel.logo}" alt="${channel.displayName}" 
                                     class="w-8 h-8 rounded object-contain bg-slate-800">
                            ` : `
                                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center">
                                    <i class="fas fa-tv text-slate-400"></i>
                                </div>
                            `}
                            <div class="flex-1">
                                <div class="font-medium">${channel.displayName}</div>
                                <div class="text-xs text-slate-400">${channel.category} • ${channel.country}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                elements.searchSuggestions.classList.remove('hidden');
                
                // Add click handlers
                document.querySelectorAll('.search-suggestion').forEach(item => {
                    item.addEventListener('click', () => {
                        const channelId = item.dataset.id;
                        navigateToChannel(channelId);
                        elements.searchSuggestions.classList.add('hidden');
                    });
                });
            } else {
                elements.searchSuggestions.classList.add('hidden');
            }
        }

        function navigateToChannel(channelId) {
            const channelElement = document.getElementById(`channel-${channelId}`);
            if (channelElement) {
                channelElement.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
                
                // Highlight
                channelElement.classList.add('search-highlight');
                setTimeout(() => {
                    channelElement.classList.remove('search-highlight');
                }, 2000);
            }
        }

        function channelMatchesSearch(channel, term) {
            return channel.displayName.toLowerCase().includes(term) ||
                   channel.category.toLowerCase().includes(term) ||
                   channel.country.toLowerCase().includes(term);
        }

        function toggleFavorite(channelId, button) {
            const index = state.favorites.indexOf(channelId);
            const channel = state.channels.find(c => c.id === channelId);
            
            if (index === -1) {
                // Add to favorites
                state.favorites.push(channelId);
                button.classList.add('text-red-400');
                button.querySelector('i').classList.replace('far', 'fas');
                if (channel) channel.isFavorite = true;
            } else {
                // Remove from favorites
                state.favorites.splice(index, 1);
                button.classList.remove('text-red-400');
                button.querySelector('i').classList.replace('fas', 'far');
                if (channel) channel.isFavorite = false;
            }
            
            localStorage.setItem('channelFavorites', JSON.stringify(state.favorites));
        }

        function playChannel(channelId) {
            window.location.href = `/plus-channel/${channelId}`;
        }

        function collapseAllCategories() {
            document.querySelectorAll('.category-section').forEach(section => {
                section.classList.add('hidden');
            });
        }

        function handleScroll() {
            // Show/hide scroll to top button
            if (window.scrollY > 300) {
                elements.scrollToTop.classList.remove('opacity-0', 'translate-y-10');
                elements.scrollToTop.classList.add('opacity-100', 'translate-y-0');
            } else {
                elements.scrollToTop.classList.remove('opacity-100', 'translate-y-0');
                elements.scrollToTop.classList.add('opacity-0', 'translate-y-10');
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleOutsideClick(e) {
            // Close search suggestions
            if (!elements.searchInput.contains(e.target) && 
                !elements.searchSuggestions.contains(e.target)) {
                elements.searchSuggestions.classList.add('hidden');
            }
            
            // Close filter panel
            if (!elements.filterToggle.contains(e.target) && 
                !elements.filterPanel.contains(e.target)) {
                elements.filterPanel.classList.add('hidden');
            }
        }

        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                elements.searchInput.focus();
            }
            
            // Escape to clear search
            if (e.key === 'Escape' && elements.searchInput.value) {
                clearSearch();
            }
        }

        // ================== STATUS CHECKING ==================

        async function startStatusChecking() {
            if (state.statusCheckRunning) return;
            
            state.statusCheckRunning = true;
            
            // Create queue of channels to check
            state.statusCheckQueue = [...state.channels];
            
            // Process queue in batches
            await processStatusQueue();
            
            state.statusCheckRunning = false;
        }

        async function processStatusQueue() {
            const BATCH_SIZE = 5; // Check 5 channels at a time
            const DELAY = 500; // 500ms between batches
            
            while (state.statusCheckQueue.length > 0) {
                const batch = state.statusCheckQueue.splice(0, BATCH_SIZE);
                
                await Promise.all(batch.map(async (channel) => {
                    await checkSingleChannelStatus(channel);
                }));
                
                // Update stats after each batch
                updateStats();
                
                // Small delay between batches
                if (state.statusCheckQueue.length > 0) {
                    await new Promise(resolve => setTimeout(resolve, DELAY));
                }
            }
        }

        async function checkSingleChannelStatus(channel) {
            if (!channel.url) {
                channel.status = 'offline';
                return;
            }
            
            try {
                const response = await fetch(`/check-channel-status?url=${encodeURIComponent(channel.url)}`);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                channel.status = data.status === 'live' ? 'live' : 'offline';
            } catch (error) {
                channel.status = 'offline';
            }
            
            // Update the UI for this channel
            updateChannelStatusUI(channel);
        }

        function updateChannelStatusUI(channel) {
            const channelElement = document.getElementById(`channel-${channel.id}`);
            if (!channelElement) return;
            
            const statusElement = channelElement.querySelector('.status-live, .status-offline, .status-checking');
            if (statusElement) {
                statusElement.className = `status-${channel.status} px-2 py-1 rounded-full text-xs font-medium`;
                statusElement.textContent = channel.status === 'live' ? 'LIVE' : 'OFFLINE';
            }
        }
    </script>
</body>
</html>
