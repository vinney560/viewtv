<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Verdana;
      background: radial-gradient(circle, #111827, #2563eb);
    }
  </style>
</head>
<body>
  <h1 class="font-bold italic text-blue-200 mb-9">
    My Own Iframe Player
  </h1>

  <div class="w-full max-w-2xl aspect-video">
    <iframe 
      class="w-full h-full rounded-xl shadow-lg"
      src="https://www.youtube.com/embed/f9xpB6hxM78?rel=0&controls=1"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
